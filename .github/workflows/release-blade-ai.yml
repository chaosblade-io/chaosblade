# Migration-ready release workflow for placement at
# ``chaosblade-io/chaosblade/.github/workflows/release-blade-ai.yml``
# AFTER moving fault-drill-agent into ``chaosblade/blade-ai/``.
#
# Differences vs the in-repo ``.github/workflows/release.yml``:
#   * Tag namespace switched from ``v*`` to ``blade-ai-v*`` so the
#     ChaosBlade tool's own ``v*`` tags don't accidentally fire this
#     pipeline.
#   * ``paths`` filter restricts triggers to changes inside
#     ``blade-ai/**`` — chaosblade-only commits don't waste CI minutes
#     here.
#   * Every project path is prefixed with ``blade-ai/`` so the workflow
#     resolves files from the chaosblade repo root.
#   * Working directories for npm / build / publish steps moved to
#     ``blade-ai/`` and ``blade-ai/tui/``.
#   * Docker volume mount targets ``$PWD/blade-ai`` so the container's
#     ``/src`` cwd matches what blade-ai.spec expects.

name: Release blade-ai

on:
  push:
    tags: ['blade-ai-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release (e.g. blade-ai-v0.3.0-alpha.1; must match all version files)'
        required: true
        default: ''

permissions:
  contents: write

env:
  CHAOSBLADE_VERSION: '1.9.0-alpha'
  NODE_VERSION: '24.16.0'

jobs:
  # ── Verify all version files agree with the release tag ────────────────
  # Files coordinated:
  #   - pyproject.toml ``version = "..."``
  #   - tui/package.json ``"version": "..."``
  #   - web/package.json ``"version": "..."``
  #   - src/chaos_agent/__init__.py ``__version__ = "..."``
  verify-versions:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
      tag: ${{ steps.derive.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - name: Derive tag/version from inputs or ref
        id: derive
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # Strip the ``blade-ai-v`` prefix to recover the bare semver
          # used in pyproject / package.json / __version__.
          VERSION="${TAG#blade-ai-v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag: $TAG · Version: $VERSION"

      - name: Verify blade-ai/pyproject.toml
        shell: bash
        run: |
          PKG="$(grep -E '^version = ' blade-ai/pyproject.toml | head -1 | sed -E 's/^version = "(.*)"/\1/')"
          if [ "${{ steps.derive.outputs.version }}" != "$PKG" ]; then
            echo "::error::blade-ai/pyproject.toml version ($PKG) ≠ tag ${{ steps.derive.outputs.tag }}"
            exit 1
          fi
          echo "✓ blade-ai/pyproject.toml matches"

      - name: Verify blade-ai/tui/package.json
        shell: bash
        run: |
          PKG="$(node -p 'require("./blade-ai/tui/package.json").version')"
          if [ "${{ steps.derive.outputs.version }}" != "$PKG" ]; then
            echo "::error::blade-ai/tui/package.json version ($PKG) ≠ tag ${{ steps.derive.outputs.tag }}"
            exit 1
          fi
          echo "✓ blade-ai/tui/package.json matches"

      - name: Verify blade-ai/web/package.json
        shell: bash
        run: |
          PKG="$(node -p 'require("./blade-ai/web/package.json").version')"
          if [ "${{ steps.derive.outputs.version }}" != "$PKG" ]; then
            echo "::error::blade-ai/web/package.json version ($PKG) ≠ tag ${{ steps.derive.outputs.tag }}"
            exit 1
          fi
          echo "✓ blade-ai/web/package.json matches"

      - name: Verify blade-ai/src/chaos_agent/__init__.py
        shell: bash
        run: |
          PKG="$(grep -E '^__version__ = ' blade-ai/src/chaos_agent/__init__.py | head -1 | sed -E 's/^__version__ = "(.*)"/\1/')"
          if [ "${{ steps.derive.outputs.version }}" != "$PKG" ]; then
            echo "::error::blade-ai/src/chaos_agent/__init__.py __version__ ($PKG) ≠ tag ${{ steps.derive.outputs.tag }}"
            exit 1
          fi
          echo "✓ blade-ai/src/chaos_agent/__init__.py matches"

  # ── Build the TS TUI + Web UI bundles once, share via artifacts ────────
  # The bundles are consumed by the build matrix below (PyInstaller embeds
  # both via blade-ai.spec: tui/dist/cli.js → _tui_assets, web/dist →
  # _web_assets).
  build-tui:
    needs: verify-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          # npm workspaces: tui/ and web/ share ONE lockfile at the
          # blade-ai workspace root.
          cache-dependency-path: blade-ai/package-lock.json
      - name: Install dependencies
        working-directory: blade-ai
        run: |
          # GitHub-hosted Linux runners hit npm's "Exit handler never
          # called!" bug when patch-package runs in postinstall. Two-part
          # workaround:
          #
          # 1) Pin to npm 10.9.2 — Node 22's bundled npm 11 is more
          #    flaky here. The downgrade itself can trigger the same
          #    exit-handler bug right after the package swap, so `|| true`
          #    lets us keep going since the new npm is already on PATH.
          # 2) Install with --ignore-scripts so postinstall (which runs
          #    patch-package) is NOT executed inside npm. Then apply
          #    patches by invoking the patch-package binary directly,
          #    bypassing npm's lifecycle / exit handler entirely.
          #
          # Without (2) the job hangs forever after npm prints
          # "Exit handler never called!" and never returns to the shell.
          npm install -g npm@10.9.2 || true
          npm --version
          npm ci --ignore-scripts --prefer-offline --no-audit --no-fund \
            || npm install --ignore-scripts --no-audit --no-fund
          # Apply tui/patches/ explicitly (postinstall was skipped above).
          # Workspaces hoist node_modules to the workspace root, so the
          # binary lives one level up; --patch-dir mirrors the root
          # package.json postinstall script.
          ./node_modules/.bin/patch-package --patch-dir tui/patches
      - name: Typecheck (TUI)
        working-directory: blade-ai/tui
        run: npm run typecheck
      - name: Build TUI bundle
        working-directory: blade-ai/tui
        run: npm run build
      - name: Vitest (TUI)
        working-directory: blade-ai/tui
        run: npm test
      # - name: Headless smokes (server-less subset)
      #   working-directory: blade-ai/tui
      #   # smoke-slash.mjs has a built-in watchdog (default 120s) and
      #   # emits ``[probe] <label>`` lines to stderr on every tsImport
      #   # and major test-block boundary. If CI hangs again, the last
      #   # ``[probe]`` line in the failure log pinpoints where the
      #   # script stopped — diagnostics-only and removable once the
      #   # underlying CI hang is understood.
      #   run: |
      #     node scripts/smoke-i18n.mjs
      #     node scripts/smoke-slash.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: tui-bundle
          # Both cli.js (the bundle) and package.json (the {"type":"module"}
          # marker that prevents Node 22's MODULE_TYPELESS_PACKAGE_JSON
          # warning) are required by blade-ai.spec's datas list. Listing
          # them explicitly (rather than uploading the whole dist/ dir)
          # keeps the artifact small — tsup also drops a 6.5 MB cli.js.map
          # we don't need to ship into the PyInstaller bundle.
          path: |
            blade-ai/tui/dist/cli.js
            blade-ai/tui/dist/package.json
          retention-days: 7
          if-no-files-found: error

      # Web UI bundle — embedded into the PyInstaller binary via
      # blade-ai.spec (web/dist → chaos_agent/_web_assets) and served by
      # FastAPI StaticFiles at "/" (chaos_agent.server.web), so
      # ``blade-ai web`` works out of the standalone binary.
      - name: Typecheck (Web)
        working-directory: blade-ai/web
        run: npm run typecheck
      - name: Build Web UI bundle
        working-directory: blade-ai/web
        run: npm run build
      - name: Vitest (Web)
        working-directory: blade-ai/web
        run: npm test
      - name: Verify Web UI bundle
        working-directory: blade-ai
        run: ls -la web/dist/index.html
      - uses: actions/upload-artifact@v6
        with:
          name: web-bundle
          path: blade-ai/web/dist
          retention-days: 7
          if-no-files-found: error

  # ── Build native binaries on each platform ──────────────────────────────
  build:
    needs: [verify-versions, build-tui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            target: linux_amd64
            node_arch: linux-x64
            node_ext: tar.xz
            pkg_ext: tar.gz
            runner: ubuntu-latest
            use_docker: true
          - os: linux
            arch: arm64
            target: linux_arm64
            node_arch: linux-arm64
            node_ext: tar.xz
            pkg_ext: tar.gz
            runner: ubuntu-24.04-arm
            use_docker: true
          - os: darwin
            arch: amd64
            target: darwin_amd64
            node_arch: darwin-x64
            node_ext: tar.gz
            pkg_ext: tar.gz
            runner: macos-15
          - os: darwin
            arch: arm64
            target: darwin_arm64
            node_arch: darwin-arm64
            node_ext: tar.gz
            pkg_ext: tar.gz
            runner: macos-15
          # Windows client. No ChaosBlade vendor bundle (upstream ships
          # no Windows agent) — fault injection still works end-to-end
          # because all carriers run on the REMOTE target: kubectl-native
          # control-plane faults, `kubectl exec <pod> -- blade create`
          # fallback, and ssh/kubewiz host transports. Locally only
          # kubectl.exe is expected on PATH.
          - os: windows
            arch: x64
            target: windows_x64
            node_arch: win-x64
            node_ext: zip
            pkg_ext: zip
            runner: windows-latest

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      # Pull the TS bundle into ``blade-ai/tui/dist/cli.js`` BEFORE
      # pyinstaller runs.
      - uses: actions/download-artifact@v7
        with:
          name: tui-bundle
          path: blade-ai/tui/dist
      - name: Verify TS bundle in place
        shell: bash
        run: ls -la blade-ai/tui/dist/cli.js

      # Pull the Web UI bundle into ``blade-ai/web/dist`` BEFORE both
      # ``pip install -e`` (hatchling's build_editable validates the
      # ``web/dist`` force-include target in pyproject.toml) and
      # pyinstaller (blade-ai.spec embeds it as _web_assets).
      - uses: actions/download-artifact@v7
        with:
          name: web-bundle
          path: blade-ai/web/dist
      - name: Verify Web bundle in place
        shell: bash
        run: ls -la blade-ai/web/dist/index.html

      - name: Download ChaosBlade tool
        # No upstream Windows agent release — skip on Windows. The spec
        # tolerates an absent vendor dir (blade-ai.spec skips bundling),
        # and injection falls back to kubectl-native / kubectl-exec /
        # remote-transport carriers.
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          VER="${CHAOSBLADE_VERSION}"
          ARCH="${{ matrix.target }}"
          URL="https://chaosblade.oss-cn-hangzhou.aliyuncs.com/agent/github/${VER}/chaosblade-${VER}-${ARCH}.tar.gz"
          echo "Fetching $URL"
          curl -fSL --retry 3 --retry-delay 2 -o /tmp/chaosblade.tar.gz "$URL"
          rm -rf blade-ai/vendor/chaosblade
          mkdir -p blade-ai/vendor
          tar -xzf /tmp/chaosblade.tar.gz -C /tmp
          mv "/tmp/chaosblade-${VER}-${ARCH}" blade-ai/vendor/chaosblade
          echo "blade-ai/vendor/chaosblade contents:"
          ls -la blade-ai/vendor/chaosblade
          file blade-ai/vendor/chaosblade/blade || true

      # ── Download Node.js runtime for bundling into the binary ────────
      # The TS TUI (tui/dist/cli.js) needs Node to run. By bundling
      # the Node binary we make the standalone binary truly zero-dep.
      # Only the ``node`` executable is kept (not npm/npx/corepack).
      - name: Download Node.js runtime
        shell: bash
        run: |
          set -euo pipefail
          VER="${NODE_VERSION}"
          ARCH="${{ matrix.node_arch }}"
          EXT="${{ matrix.node_ext }}"
          BASENAME="node-v${VER}-${ARCH}"
          URL="https://nodejs.org/dist/v${VER}/${BASENAME}.${EXT}"
          echo "Fetching $URL"
          curl -fSL --retry 3 --retry-delay 2 -o "/tmp/node-archive.${EXT}" "$URL"
          rm -rf blade-ai/vendor/node
          mkdir -p blade-ai/vendor/node
          if [ "$EXT" = "tar.xz" ]; then
            tar -xJf "/tmp/node-archive.${EXT}" -C /tmp
          elif [ "$EXT" = "zip" ]; then
            # Git-Bash on windows-latest resolves `tar` to GNU tar,
            # which cannot read zip archives — extract via PowerShell.
            # Like the Unix tarballs the zip carries a top-level
            # <basename>/ dir, so expanding into /tmp yields
            # /tmp/<basename>/node.exe. (Git-Bash /tmp is NOT C:\tmp —
            # convert with cygpath.)
            WIN_ARCHIVE="$(cygpath -w "/tmp/node-archive.${EXT}")"
            WIN_DEST="$(cygpath -w /tmp)"
            powershell -NoProfile -Command "Expand-Archive -LiteralPath '$WIN_ARCHIVE' -DestinationPath '$WIN_DEST' -Force"
          else
            tar -xzf "/tmp/node-archive.${EXT}" -C /tmp
          fi
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp "/tmp/${BASENAME}/node.exe" blade-ai/vendor/node/node.exe
          else
            cp "/tmp/${BASENAME}/bin/node" blade-ai/vendor/node/node
            chmod +x blade-ai/vendor/node/node
            # libstdc++/libgcc_s are deliberately NOT bundled here. This step
            # runs on the runner host (ubuntu-latest / ubuntu-24.04-arm,
            # glibc 2.39), so `ldd node` resolved to the RUNNER's libstdc++
            # and libgcc_s, which need GLIBC_2.38 / GLIBC_2.35. Copying them
            # raised the whole bundle's floor to 2.38 and made it unloadable
            # on every host below that (issue #1349).
            #
            # The comment that used to sit here justified the copy with "on
            # old-glibc targets (Alinux 3 / RHEL 8) the system libstdc++
            # lacks GLIBCXX_3.4.30". Both halves are wrong, measured with
            # objdump -T: Node 24.16.0 needs only GLIBCXX_3.4.21 /
            # CXXABI_1.3.11, and the RHEL-8-class libstdc++ it named as
            # insufficient already offers 3.4.25. It also claimed to ship
            # "Node's own copy", but Node's official linux tarball links the
            # SYSTEM libstdc++ — there is no own copy to ship.
            #
            # The Linux build step below copies these libs from INSIDE the
            # build container instead, and asserts they satisfy Node.
          fi
          echo "blade-ai/vendor/node contents:"
          ls -laR blade-ai/vendor/node
          file blade-ai/vendor/node/node* 2>/dev/null || true

      # ── Linux: build inside manylinux_2_28 Docker (glibc 2.28 baseline) ──
      #
      # The bundle's glibc floor is the MAX over every ELF inside it, so the
      # image decides compatibility far more than any code change does.
      # manylinux_2_28 (AlmaLinux 8, glibc 2.28, maintained through 2029-05)
      # is the lowest baseline that still receives updates:
      #   RHEL/CentOS/Alma/Rocky 8 = 2.28   covered
      #   Debian 11 / Ubuntu 20.04 = 2.31   covered
      #   EulerOS 2.0 / AlmaLinux 9= 2.34   covered  (issue #1349)
      #
      # The note that used to be here ruled out manylinux images because they
      # "ship a statically-linked Python". That is true only of the
      # PREINSTALLED /opt/python/cp311-cp311 build (Py_ENABLE_SHARED=0). The
      # distro package is different: dnf's python3.11-libs provides a shared
      # /usr/lib64/libpython3.11.so.1.0 with Py_ENABLE_SHARED=1, which is
      # exactly what PyInstaller requires. Verified end-to-end — bundle floor
      # GLIBC_2.28, all Rust/C deps resolve to manylinux wheels, and the
      # frozen binary runs.
      #
      # History: a two-line bump of IMG to python:3.11-slim-bookworm (glibc
      # 2.36) shipped a GLIBC_2.35 baseline for ~15 releases while this
      # comment block still advertised "Bullseye (glibc 2.31 baseline)", so
      # the regression was invisible in diff review. The "Assert the Linux
      # bundle glibc floor" step below exists to make that unrepeatable.
      - name: Build with PyInstaller (manylinux_2_28 Docker, glibc 2.28)
        if: matrix.use_docker
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            linux_amd64)  IMG=quay.io/pypa/manylinux_2_28_x86_64 ;;
            linux_arm64)  IMG=quay.io/pypa/manylinux_2_28_aarch64 ;;
            *) echo "::error::no Docker image for target ${{ matrix.target }}"; exit 1 ;;
          esac
          docker run --rm \
            -v "$PWD/blade-ai:/src" \
            -w /src \
            "$IMG" \
            bash -c '
              set -euo pipefail

              # Use the DISTRO python3.11, never a bare `python3.11`.
              # manylinux images place /usr/local/bin/python3.11 -> the
              # preinstalled /opt/python/cp311-cp311 build AHEAD of /usr/bin
              # on PATH, and that interpreter has a static libpython
              # (Py_ENABLE_SHARED=0) which PyInstaller cannot use. There is
              # also no bare `python` on PATH at all.
              dnf install -y python3.11 python3.11-devel python3.11-pip binutils
              PY=/usr/bin/python3.11
              "$PY" --version
              "$PY" -c "import sys,sysconfig; v=sysconfig.get_config_var(\"Py_ENABLE_SHARED\"); print(\"Py_ENABLE_SHARED=\",v,\"LDLIBRARY=\",sysconfig.get_config_var(\"LDLIBRARY\"),\"LIBDIR=\",sysconfig.get_config_var(\"LIBDIR\")); sys.exit(0 if v==1 else 1)"

              # Every Rust/C extension in the dependency set (pydantic-core,
              # watchfiles, uvloop, httptools, tiktoken, cryptography, lxml,
              # grpcio, rpds-py) resolves to a prebuilt manylinux wheel, so
              # neither a compiler nor Rust is required. binutils above is
              # for the ABI assertions, not for building.
              "$PY" -m venv /tmp/venv
              . /tmp/venv/bin/activate
              python -m pip install --upgrade pip
              python -m pip install -e ".[dev]"

              # Bundle libstdc++/libgcc_s from THIS container. Note the two
              # live in the same dir on RHEL-class systems but NOT on Debian
              # 11 (no usrmerge: libstdc++ in /usr/lib/<triplet>, libgcc_s in
              # /lib/<triplet>) — enumerate rather than assume one path.
              mkdir -p vendor/node/lib
              cp -Lv /usr/lib64/libstdc++.so.6 vendor/node/lib/
              cp -Lv /usr/lib64/libgcc_s.so.1  vendor/node/lib/
              ls -la vendor/node/lib/

              # Assert the shipped libstdc++ satisfies the bundled Node.
              # Both sides are derived from the binaries rather than
              # hardcoded, so a Node bump fails the build instead of
              # silently breaking old hosts. manylinux_2_28 offers
              # GLIBCXX_3.4.25 / CXXABI_1.3.11 while Node 24.16.0 needs
              # 3.4.21 / 1.3.11 — CXXABI has ZERO headroom, which is exactly
              # why this cannot be left implicit.
              # Trailing `|| true` on both: grep exits 1 when a family has no
              # match, and under `set -o pipefail` that propagates out of the
              # command substitution into the assignment, so `set -e` would
              # abort the step with no message at all — making the empty-value
              # guards below unreachable. Measured, not theorised.
              abi_offer() { objdump -T "$1" 2>/dev/null | grep -v "\*UND\*" | grep -oE "$2_[0-9]+(\.[0-9]+)*" | sort -uV | tail -1 || true; }
              abi_need()  { objdump -T "$1" 2>/dev/null | grep "\*UND\*"     | grep -oE "$2_[0-9]+(\.[0-9]+)*" | sort -uV | tail -1 || true; }
              for fam in GLIBCXX CXXABI; do
                need=$(abi_need  vendor/node/node "$fam")
                have=$(abi_offer vendor/node/lib/libstdc++.so.6 "$fam")
                if [ -z "$need" ]; then echo "ABI ok: $fam — node demands nothing"; continue; fi
                if [ -z "$have" ] || [ "$(printf "%s\n%s\n" "$need" "$have" | sort -V | tail -1)" != "$have" ]; then
                  echo "::error::shipped libstdc++ offers ${have:-none} but node needs $need ($fam)"
                  exit 1
                fi
                echo "ABI ok: $fam — node needs $need, shipped libstdc++ offers $have"
              done

              python -m PyInstaller blade-ai.spec --noconfirm
            '

      # ── Guard the glibc floor of the Linux bundle ────────────────────
      #
      # Whether the bundle loads is decided by the MAX GLIBC_2.x demanded by
      # any ELF inside it — a property of the build image, not of our source.
      # Nothing in a normal diff review reveals it, which is how a two-line
      # IMG bump to bookworm shipped a GLIBC_2.35 floor for ~15 releases and
      # broke every host below it (issue #1349). This turns the baseline into
      # an assertion that fails the release instead of the user's machine.
      #
      # Files are selected by ELF magic, not by a *.so glob: the glob misses
      # extension-less binaries (the launcher, vendor/node/node) while
      # scanning every file would let a text file that merely mentions
      # "GLIBC_2.3x" inflate the floor.
      #
      # grep -ao, not objdump -T: no binutils needed on the runner and it is
      # architecture-independent. Verified item-for-item equal to
      # `objdump -T | grep -o 'GLIBC_2\.[0-9]*'` on both x86_64 and aarch64.
      # Safe because nothing in the bundle DEFINES a GLIBC_2.x version — only
      # glibc itself does — so every occurrence is a requirement.
      #
      # The chaosblade vendor tree is deliberately not a concern here: blade
      # and chaos_* are built with CGO_ENABLED=0 (Makefile L64) and nsexec
      # with `gcc -static` (Makefile L329/L332), so all of them are static
      # and contribute no glibc requirement.
      - name: Assert the Linux bundle glibc floor
        if: matrix.use_docker
        shell: bash
        env:
          MAX_GLIBC: '2.28'
        run: |
          set -euo pipefail
          BUNDLE="blade-ai/dist/blade-ai"
          MAX="$MAX_GLIBC"
          # Exact two-digit match: a trailing glob (2.[0-9]*) would accept
          # junk after the digits.
          case "$MAX" in
            2.[0-9][0-9]) : ;;
            *) echo "::error::MAX_GLIBC must look like 2.NN, got '$MAX'"; exit 1 ;;
          esac
          test -x "$BUNDLE/blade-ai" || { echo "::error::bundle launcher $BUNDLE/blade-ai is missing"; exit 1; }

          echo "=== libpython shipped in the bundle ==="
          LIBPY=$(find "$BUNDLE" -name 'libpython*.so*' 2>/dev/null | sed -n 1p)
          if [ -z "$LIBPY" ]; then
            # PyInstaller cannot freeze a static libpython, so an absent one
            # means the build silently used the preinstalled /opt/python
            # interpreter instead of the distro one.
            echo "::error::no libpython inside $BUNDLE"
            exit 1
          fi
          ls -la "$LIBPY"

          echo "=== Node runtime shipped in the bundle ==="
          # main.py replaces LD_LIBRARY_PATH with this dir wholesale, so a
          # missing libstdc++ here is not a soft degradation.
          for req in _internal/vendor/node/node \
                     _internal/vendor/node/lib/libstdc++.so.6 \
                     _internal/vendor/node/lib/libgcc_s.so.1; do
            if [ ! -e "$BUNDLE/$req" ]; then
              echo "::error::$req missing from the bundle — the TUI cannot run"
              exit 1
            fi
          done
          ls -la "$BUNDLE/_internal/vendor/node/lib/"

          find "$BUNDLE" -type f -print0 \
            | xargs -0 grep -la $'\x7fELF' 2>/dev/null > /tmp/elfs.txt || true
          [ -s /tmp/elfs.txt ] || { echo "::error::no ELF files enumerated"; exit 1; }
          echo "ELF files to scan: $(wc -l < /tmp/elfs.txt)"

          : > /tmp/nodes.txt
          while IFS= read -r f; do
            # `|| true` inside the substitution: grep exits 1 for an ELF that
            # references no versioned glibc symbol, and pipefail would turn
            # that into a silent abort of the whole step.
            n=$(grep -ao 'GLIBC_2\.[0-9]*' "$f" 2>/dev/null | sort -uV | tail -1 || true)
            # if/fi, not `[ -n "$n" ] && echo`: a bare AND-list whose test
            # fails returns non-zero and set -e aborts the whole step on the
            # first .so that references no versioned glibc symbol.
            if [ -n "$n" ]; then echo "$n|$f" >> /tmp/nodes.txt; fi
          done < /tmp/elfs.txt
          [ -s /tmp/nodes.txt ] || { echo "::error::no GLIBC symbol versions found"; exit 1; }

          echo "=== top 15 offenders (highest GLIBC first) ==="
          # sed, not head: head closing the pipe early gives sort a SIGPIPE,
          # which pipefail turns into exit 141.
          # -k1,1 -V -r, NOT -k1,1V -r: a key-specific V flag makes sort
          # ignore the global -r and print ASCENDING, which truncates away
          # exactly the highest (most interesting) entries.
          sort -t'|' -k1,1 -V -r /tmp/nodes.txt | sed -n '1,15p'

          HIGH=$(cut -d'|' -f1 /tmp/nodes.txt | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "=== bundle glibc floor: GLIBC_$HIGH (configured limit: GLIBC_$MAX) ==="
          if [ "$HIGH" != "$MAX" ] && [ "$(printf '%s\n%s\n' "$MAX" "$HIGH" | sort -V | tail -1)" = "$HIGH" ]; then
            echo "::error::bundle requires GLIBC_$HIGH, above the GLIBC_$MAX limit"
            exit 1
          fi
          echo "PASS: bundle loads on any host with glibc >= $HIGH"

      # ── Native build: darwin/{amd64,arm64} + windows/x64 ────────────
      #
      # Linux never reaches these steps — both linux matrix entries set
      # use_docker: true and are built in manylinux_2_28 above. Every step
      # from here to "Package archive" is gated on !matrix.use_docker.
      #
      # darwin/amd64 special case: macos-latest is an Apple Silicon
      # (arm64) runner. To produce an x86_64 PyInstaller bundle we
      # rely on Rosetta — but that requires a Python interpreter that
      # actually has an x86_64 slice. Empirical CI runs show that
      # setup-python@v5's ``architecture: x64`` is unreliable here:
      # it can still hand back an arm64 build (which is what triggered
      # the previous ``_watchdog_fsevents.so has arch arm64`` failure
      # at PyInstaller COLLECT time). We therefore install python.org's
      # official universal2 build manually for that one matrix entry
      # — the .pkg from python.org is guaranteed to be a fat binary
      # with both arm64 and x86_64 slices, so ``arch -x86_64 python3.11``
      # really does run x86_64.
      - name: Install universal2 Python from python.org (darwin/amd64)
        if: matrix.os == 'darwin' && matrix.arch == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          PYVER=3.11.9
          PKG="python-${PYVER}-macos11.pkg"
          curl -fSLO "https://www.python.org/ftp/python/${PYVER}/${PKG}"
          sudo installer -pkg "${PKG}" -target /
          rm -f "${PKG}"
          # Push the python.org bin to PATH so subsequent steps see
          # python3.11 from the universal2 install (not from the
          # runner's pre-baked Python). $GITHUB_PATH is appended in
          # order so this dir wins over later setup-python entries.
          echo "/Library/Frameworks/Python.framework/Versions/3.11/bin" >> "$GITHUB_PATH"
          PY=/Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11
          "$PY" --version
          # Sanity: confirm the binary has both slices. The output
          # should start with ``Mach-O universal binary with 2
          # architectures: [x86_64:..., arm64:...]``.
          file "$PY"

      - name: Set up Python
        # All non-Docker matrices except darwin/amd64 (which got a
        # universal2 Python above). Single-line if expression keeps
        # the YAML readable; equivalent to the long disjunction.
        if: ${{ !matrix.use_docker && !(matrix.os == 'darwin' && matrix.arch == 'amd64') }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: blade-ai/pyproject.toml

      - name: Install project + dev tools (native)
        if: '!matrix.use_docker'
        shell: bash
        working-directory: blade-ai
        run: |
          set -euo pipefail
          # darwin/amd64 cross-build via Rosetta. ``arch -x86_64 python3.11``
          # forces the universal2 Python into its x86_64 slice. We also
          # set _PYTHON_HOST_PLATFORM=macosx-11.0-x86_64 so pip:
          #   1) generates x86_64-only platform tags (no arm64), which
          #      prevents pulling arm64-only wheels like
          #      ``cryptography-*-macosx_11_0_arm64.whl`` whose
          #      ``_rust.abi3.so`` has no x86_64 slice;
          #   2) still matches universal2 wheels (e.g.
          #      ``macosx_10_12_universal2``), because universal2
          #      contains x86_64 and 10.12 <= 11.0.
          # The macOS version MUST be >= 10.12 (the min macOS of the
          # universal2 cryptography wheel); using 10.9 here previously
          # caused pip to skip the universal2 wheel and fall back to a
          # source build that failed due to openssl-sys cross-compile.
          # ``--only-binary cryptography`` is a belt-and-suspenders guard:
          # if no compatible wheel is found, fail fast instead of
          # attempting a source build that cannot cross-compile openssl.
          if [[ "${{ matrix.os }}-${{ matrix.arch }}" == "darwin-amd64" ]]; then
            PY="arch -x86_64 python3.11"
            export _PYTHON_HOST_PLATFORM=macosx-11.0-x86_64
            ONLY_BIN="--only-binary cryptography"
          else
            PY="python"
            ONLY_BIN=""
          fi
          $PY -m pip install --upgrade pip
          $PY -m pip install $ONLY_BIN -e ".[dev]"

      - name: Build with PyInstaller (native)
        if: '!matrix.use_docker'
        shell: bash
        working-directory: blade-ai
        run: |
          set -euo pipefail
          # BLADE_TARGET_ARCH is a hint to blade-ai.spec so PyInstaller
          # emits a bootloader for the matching slice. The interpreter
          # arch already matches (see Install step above), this just
          # makes the intent explicit and survives PyInstaller default
          # changes.
          case "${{ matrix.os }}-${{ matrix.arch }}" in
            darwin-amd64) PY="arch -x86_64 python3.11"; export BLADE_TARGET_ARCH=x86_64 ;;
            darwin-arm64) PY="python";                  export BLADE_TARGET_ARCH=arm64  ;;
            *)            PY="python" ;;
          esac
          $PY -m PyInstaller blade-ai.spec --noconfirm

      # Ad-hoc codesign so the unsigned bootloader doesn't get killed
      # by Gatekeeper when users curl-bash install on macOS.
      - name: Ad-hoc codesign (macOS)
        if: matrix.os == 'darwin'
        shell: bash
        run: |
          codesign --force --deep --sign - blade-ai/dist/blade-ai/blade-ai

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM="${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            # Git-Bash's tar is GNU tar (no zip write), so use 7z
            # (preinstalled on windows-latest) with a PowerShell
            # Compress-Archive fallback. Archive layout stays identical
            # to the Unix tarballs: ``blade-ai/`` at the root.
            if command -v 7z >/dev/null 2>&1; then
              7z a -tzip "blade-ai-${PLATFORM}.zip" "blade-ai/dist/blade-ai" >/dev/null
            else
              powershell -NoProfile -Command "Compress-Archive -Path 'blade-ai/dist/blade-ai' -DestinationPath 'blade-ai-${PLATFORM}.zip' -Force"
            fi
          else
            tar -czf "blade-ai-${PLATFORM}.tar.gz" -C blade-ai/dist blade-ai
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: blade-ai-${{ matrix.os }}-${{ matrix.arch }}
          path: blade-ai-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.pkg_ext }}
          if-no-files-found: error
          retention-days: 1

  # ── Create GitHub Release with all artifacts + checksums ───────────────
  release:
    needs: [verify-versions, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} . \;
          shopt -s nullglob
          files=(*.tar.gz *.zip)
          sha256sum "${files[@]}" > checksums.txt
          cat checksums.txt

      # Mirror the release artifacts to Alibaba Cloud OSS so users in
      # mainland China can install via BLADE_AI_MIRROR (see scripts/install.sh).
      # Layout mirrors the GitHub release path: <TAG>/blade-ai-<platform>.tar.gz
      #
      # ossutil is fetched directly instead of yizhoumo/setup-ossutil:
      # the action still targets the deprecated Node.js 20 runtime and
      # has no Node 24 release. The release job runs on ubuntu-latest,
      # so the linux/amd64 binary from the official CDN is enough.
      - name: Setup ossutil
        shell: bash
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          OSSUTIL_VERSION="1.7.14"
          curl -fSL --retry 3 --retry-delay 2 -o /usr/local/bin/ossutil \
            "https://gosspublic.alicdn.com/ossutil/${OSSUTIL_VERSION}/ossutil64"
          chmod +x /usr/local/bin/ossutil
          ossutil config -e "$OSS_ENDPOINT" -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET"
          ossutil --version

      - name: Upload packages to OSS
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.verify-versions.outputs.tag }}
        run: |
          echo "Uploading blade-ai packages to OSS..."
          for entry in linux-amd64.tar.gz linux-arm64.tar.gz darwin-amd64.tar.gz darwin-arm64.tar.gz windows-x64.zip; do
            package_file="artifacts/blade-ai-${entry}"
            if [[ -f "$package_file" ]]; then
              echo "Uploading ${entry} package..."
              ossutil cp -f "$package_file" "oss://chaosblade/blade-ai/github/${RELEASE_TAG}/blade-ai-${entry}"
              echo "✅ ${entry} package uploaded successfully"
            else
              echo "❌ ${entry} package not found: $package_file"
            fi
          done
          if [[ -f "artifacts/checksums.txt" ]]; then
            echo "Uploading checksums file..."
            ossutil cp -f "artifacts/checksums.txt" "oss://chaosblade/blade-ai/github/${RELEASE_TAG}/checksums.txt"
            echo "✅ Checksums file uploaded successfully"
          else
            echo "❌ Checksums file not found"
          fi
          echo "All blade-ai packages uploaded to OSS successfully"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify-versions.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/checksums.txt
          body: |
            ## blade-ai ${{ needs.verify-versions.outputs.tag }}

            Bundles ChaosBlade tool v${{ env.CHAOSBLADE_VERSION }} for Linux / macOS,
            plus the built-in Web UI — `blade-ai web` serves the console from the
            standalone binary with no extra install.
            The Windows client ships without the blade binary (no upstream
            Windows agent) — injection there runs through kubectl-native
            control-plane faults, `kubectl exec` into cluster tool pods, and
            remote ssh/kubewiz host transports. `kubectl.exe` on PATH is the
            only local prerequisite.

            ### Installation

            **macOS / Linux:**
            ```bash
            curl -fsSL https://chaosblade.io/install-agent.sh | bash
            ```

            **Specify version:**
            ```bash
            curl -fsSL https://chaosblade.io/install-agent.sh | bash -s -- --version ${{ needs.verify-versions.outputs.version }}
            ```

            **Windows (PowerShell):**
            ```powershell
            irm https://chaosblade.io/install-agent.ps1 | iex
            ```

            ### 🌐 OSS Download Links
            Alternative download links from Alibaba Cloud OSS (faster in mainland China):

            - [blade-ai-linux-amd64.tar.gz](https://chaosblade.oss-cn-hangzhou.aliyuncs.com/blade-ai/github/${{ needs.verify-versions.outputs.tag }}/blade-ai-linux-amd64.tar.gz)
            - [blade-ai-linux-arm64.tar.gz](https://chaosblade.oss-cn-hangzhou.aliyuncs.com/blade-ai/github/${{ needs.verify-versions.outputs.tag }}/blade-ai-linux-arm64.tar.gz)
            - [blade-ai-darwin-amd64.tar.gz](https://chaosblade.oss-cn-hangzhou.aliyuncs.com/blade-ai/github/${{ needs.verify-versions.outputs.tag }}/blade-ai-darwin-amd64.tar.gz)
            - [blade-ai-darwin-arm64.tar.gz](https://chaosblade.oss-cn-hangzhou.aliyuncs.com/blade-ai/github/${{ needs.verify-versions.outputs.tag }}/blade-ai-darwin-arm64.tar.gz)
            - [blade-ai-windows-x64.zip](https://chaosblade.oss-cn-hangzhou.aliyuncs.com/blade-ai/github/${{ needs.verify-versions.outputs.tag }}/blade-ai-windows-x64.zip)
            - [checksums.txt](https://chaosblade.oss-cn-hangzhou.aliyuncs.com/blade-ai/github/${{ needs.verify-versions.outputs.tag }}/checksums.txt) - SHA256 checksums

            **Install from the OSS mirror:**
            ```bash
            curl -fsSL https://chaosblade.io/install-agent.sh | \
              BLADE_AI_MIRROR=https://chaosblade.oss-cn-hangzhou.aliyuncs.com/blade-ai/github \
              bash -s -- --version ${{ needs.verify-versions.outputs.version }}
            ```

            Verify the download via `checksums.txt` before extracting.
